function tickInvaderV28(){
 const a=invaderV28;if(!a)return; const d=stageDifficulty[7]??1; a.time--; a.inv=Math.max(0,a.inv-1); a.clearFlash=Math.max(0,a.clearFlash-1); a.shootCd=Math.max(0,a.shootCd-1);
 if(keys.left)a.targetX-=7.4; if(keys.right)a.targetX+=7.4; a.targetX=Math.max(56,Math.min(904,a.targetX)); a.x += (a.targetX-a.x)*.35;
 if((keys.attack||keys.up||keys.jump) && a.shootCd<=0)fireInvaderHeroShot();
 for(const st of a.bgStars){st.y+=st.v+(a.boss?0.35:0.85); if(st.y>545){st.y=-5; st.x=dice(0,960);} }
 if(!a.boss){
   a.spawnTimer--;
   if(a.spawned<a.totalSmall && a.spawnTimer<=0){spawnInvaderEnemyV29(a,d);a.spawnTimer=Math.max(15,30-d*3);}
   for(const e of a.enemies){
     if(!e.alive)continue; e.age++; e.anim=(e.anim+1)%120;
     e.x+=e.vx; e.y += Math.sin((frame+e.seed*40)*.07)*1.1 + e.vy;
     if((e.vx>0 && e.x>1030) || (e.vx<0 && e.x<-70)){ e.vx*=-1; e.y=Math.max(70,Math.min(290,e.y+dice(-40,40))); }
     if(frame%42===0)e.vy=dice(-.45,.45);
     if(Math.abs(e.x-a.x)<24 && Math.abs(e.y-a.y)<35){ e.alive=false; damageInvaderHeroV29(1,'☁️ ศัตรูบินพุ่งชน'); }
   }
   a.enemies=a.enemies.filter(e=>e.alive);
   if(a.spawned>=a.totalSmall && !a.enemies.length){ a.boss={x:-120,y:118,baseY:118,hp:46,maxHP:46,dir:1,cool:70,phase:1,swoop:0,targetX:480,targetY:240,loopT:0,entry:1}; a.clearFlash=28; }
 }else{
   const b=a.boss; b.phase=b.hp<=14?3:b.hp<=28?2:1; b.loopT++;
   if(b.entry){ b.x += 6; if(b.x>=140){ b.entry=0; b.x=140; } }
   else if(b.swoop===0){
     b.x += b.dir*(2.0+d*.22); b.y = b.baseY + Math.sin(b.loopT*.06)*22;
     if(b.x<120){b.x=120; b.dir=1;} if(b.x>840){b.x=840; b.dir=-1;}
     if(frame%(145-Math.min(45,d*10))===0){ b.swoop=1; b.targetX=(b.dir>0?820:140); b.targetY=252+dice(-14,18); }
   } else if(b.swoop===1){
     b.x += b.dir*(3.6+d*.24); b.y += 2.8+d*.12;
     if((b.dir>0 && b.x>=b.targetX) || (b.dir<0 && b.x<=b.targetX) || b.y>=b.targetY){
       b.swoop=2;
       const spread=b.phase===1?[-1.2,0,1.2]:b.phase===2?[-2,-.8,.8,2]:[-2.7,-1.4,0,1.4,2.7];
       spread.forEach(vx=>a.enemyShots.push({x:b.x,y:b.y+30,vx,vy:4.4+d*.36,r:b.phase===3?10:8,type:'orb'}));
     }
   } else {
     b.x += (-b.dir)*(2.3+d*.12); b.y -= 3.2;
     if(b.y<=b.baseY+2){ b.y=b.baseY; b.swoop=0; b.dir*=-1; }
   }
   if(Math.abs(b.x-a.x)<56 && Math.abs(b.y-a.y)<56)damageInvaderHeroV29(1,'☁️ ถูกบอสโฉบชน');
   b.cool--; if(b.cool<=0 && b.swoop===0){
     const spread=b.phase===1?[-0.9,0,.9]:b.phase===2?[-1.8,-.7,.7,1.8]:[-2.4,-1.2,0,1.2,2.4];
     spread.forEach(vx=>a.enemyShots.push({x:b.x,y:b.y+34,vx,vy:4.8+d*.38,r:b.phase===3?10:8,type:'orb'}));
     b.cool=Math.max(26,66-b.phase*8-d*4);
   }
 }
 for(const sh of a.shots){sh.x+=sh.vx||0; sh.y+=sh.vy;} a.shots=a.shots.filter(sh=>sh.y>-30 && sh.x>-20 && sh.x<980);
 for(const sh of a.enemyShots){sh.x+=sh.vx||0; sh.y+=sh.vy;} a.enemyShots=a.enemyShots.filter(sh=>sh.y<580 && sh.x>-50 && sh.x<1010);
 for(const sh of a.shots){
   if(sh.dead)continue;
   if(!a.boss){ for(const e of a.enemies){ if(!e.alive)continue; if(Math.abs(sh.x-e.x)<28 && Math.abs(sh.y-e.y)<28){ e.alive=false; sh.dead=true; a.killCount++; stageScore+=145; sfx('hit'); break; } } }
   else { const b=a.boss; if(Math.abs(sh.x-b.x)<74 && Math.abs(sh.y-b.y)<84){ sh.dead=true; b.hp--; stageScore+=60; if(b.hp<=0){ stageScore+=2300+a.hp*320+Math.floor(a.time/5); finishMiniStage(); return; } sfx('boss'); } }
 }
 a.shots=a.shots.filter(sh=>!sh.dead);
 for(const sh of a.enemyShots){ if(Math.abs(sh.x-a.x)<24 && Math.abs(sh.y-a.y)<38 && !a.inv){ sh.dead=true; damageInvaderHeroV29(1,'☁️ ถูกกระสุนบอส'); } }
 a.enemyShots=a.enemyShots.filter(sh=>!sh.dead);
 if(a.time<=0){miniRetryV23('⏱ หมดเวลาในศึกเวหา'); return;}
}
